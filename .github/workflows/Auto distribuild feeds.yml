name: Auto distribuild feeds

on:
  push:
    branches:
      - main
    paths:
      - '**/*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distribuild:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build and Install Tools (usign & apk-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev zlib1g-dev libzstd-dev lua5.3 liblua5.3-dev pkg-config scdoc meson ninja-build
          
          git clone -b master https://github.com/alpinelinux/apk-tools.git
          cd apk-tools
          meson setup -Dprefix=/usr/local build
          ninja -C build
          sudo meson install -C build
          cd ..
          
          sudo ldconfig

      - name: Restore signing key
        run: |
          # 设置 APK 签名密钥
          echo "${{ secrets.APK_SIGNING_KEY }}" | base64 -d > key-apk.sec
          chmod 600 key-apk.sec
          openssl ec -in key-apk.sec -pubout > public-key-25.12.pem

      - name: 📦 Process Feeds (Official Standards Alignment)
        run: |
          set -e
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          mkdir -p public/releases public/snapshot

          MAKE_INDEX_PY="$GITHUB_WORKSPACE/scripts/make-index-json.py"
          chmod +x "$MAKE_INDEX_PY"

          VALID_EXT="*.apk"

          # =========================================================
          # Channel A: stable releases — releases/packages-<ver>
          # (unchanged from before)
          # =========================================================
          ver="25.12"
          PHYS_ROOT="releases/packages-$ver"

          if [ -d "$PHYS_ROOT" ]; then
            # === 第一阶段：物理同步并生成索引 ===
            for sub_dir_path in $(ls -d $PHYS_ROOT/*/ 2>/dev/null); do
              sub_dir=$(basename "$sub_dir_path")
              dest_dir="$GITHUB_WORKSPACE/public/releases/packages-$ver/$sub_dir"
              
              pkg_src_dir="$sub_dir_path"
              [ -d "$sub_dir_path/packages" ] && pkg_src_dir="$sub_dir_path/packages"

              if [ "$(ls -A $pkg_src_dir/$VALID_EXT 2>/dev/null)" ]; then
                echo "📂 Processing 25.12 Feed: $sub_dir"
                mkdir -p "$dest_dir"
                
                if [ -d "$sub_dir_path/packages" ]; then
                  mkdir -p "$dest_dir/packages"
                  rsync -rlptD "$sub_dir_path/packages/" "$dest_dir/packages/"
                  target_pkg_dir="$dest_dir/packages"
                else
                  rsync -rlptD "$sub_dir_path/" "$dest_dir/"
                  target_pkg_dir="$dest_dir"
                fi

                (
                  cd "$target_pkg_dir"
                  echo "✍️ Signing APK feed for $sub_dir with ECDSA"
                  apk mkndx --allow-untrusted \
                    --sign "$GITHUB_WORKSPACE/key-apk.sec" \
                    --output packages.adb *.apk
                  
                  # 生成官方 JSON
                  apk adbdump --format json packages.adb | python3 "$MAKE_INDEX_PY" -f apk -a "$sub_dir" - > index.json
                )
              else
                echo "⏭️ Skipping $sub_dir: No APK files found."
              fi
            done

            # === 第二阶段：影子目录处理 ===
            VER_PUB="$GITHUB_WORKSPACE/public/releases/packages-$ver"
            for arch_path in $(ls -d $VER_PUB/*/ 2>/dev/null); do
              arch=$(basename "$arch_path")
              [[ "$arch" == "luci" || "$arch" == "common" ]] && continue
              
              for group in "luci" "common"; do
                phys_dir_abs="$VER_PUB/$group"
                [ ! -d "$phys_dir_abs" ] && continue
                shadow_dir="$VER_PUB/$arch/$group"
                mkdir -p "$shadow_dir"
                
                (
                  cd "$phys_dir_abs"
                  valid_files=$(ls *.apk packages.adb* 2>/dev/null || true)
                  
                  if [ -n "$valid_files" ]; then
                    echo "🔗 Linking $group -> $arch (25.12)"
                    for f in $valid_files; do
                      ln -snf "../../$group/$f" "$shadow_dir/$f"
                    done
                    
                    cd "$shadow_dir"
                    apk adbdump --format json packages.adb | python3 "$MAKE_INDEX_PY" -f apk -a "$arch" - > index.json
                  fi
                )
              done
            done

            # === 第三阶段：收尾 (25.12 专属，含版本别名) ===
            cp "$GITHUB_WORKSPACE/public-key-25.12.pem" "$GITHUB_WORKSPACE/public/releases/packages-25.12/key.pem"
            (
              cd "$GITHUB_WORKSPACE/public/releases"
              ln -snf packages-25.12 packages-25.12.4
              ln -snf packages-25.12 packages-25.12.5
              mkdir -p 25.12.4 25.12.5
              ln -snf ../packages-25.12 25.12.4/packages
              ln -snf ../packages-25.12 25.12.5/packages
            )
            echo "✅ Release feed (packages-$ver) processed successfully."
          else
            echo "⏭️ Skipping release channel: $PHYS_ROOT not found."
          fi

          # =========================================================
          # Channel B: rolling snapshot — snapshot/packages
          # Same three-phase pipeline as the release channel, but with
          # no version number and no point-release aliases, so it never
          # gets mixed with releases/packages-25.12.
          # =========================================================
          SNAP_ROOT="snapshot/packages"

          if [ -d "$SNAP_ROOT" ]; then
            # === 第一阶段：物理同步并生成索引 ===
            for sub_dir_path in $(ls -d $SNAP_ROOT/*/ 2>/dev/null); do
              sub_dir=$(basename "$sub_dir_path")
              dest_dir="$GITHUB_WORKSPACE/public/snapshot/packages/$sub_dir"

              pkg_src_dir="$sub_dir_path"
              [ -d "$sub_dir_path/packages" ] && pkg_src_dir="$sub_dir_path/packages"

              if [ "$(ls -A $pkg_src_dir/$VALID_EXT 2>/dev/null)" ]; then
                echo "📂 Processing snapshot Feed: $sub_dir"
                mkdir -p "$dest_dir"

                if [ -d "$sub_dir_path/packages" ]; then
                  mkdir -p "$dest_dir/packages"
                  rsync -rlptD "$sub_dir_path/packages/" "$dest_dir/packages/"
                  target_pkg_dir="$dest_dir/packages"
                else
                  rsync -rlptD "$sub_dir_path/" "$dest_dir/"
                  target_pkg_dir="$dest_dir"
                fi

                (
                  cd "$target_pkg_dir"
                  echo "✍️ Signing APK feed for $sub_dir with ECDSA"
                  apk mkndx --allow-untrusted \
                    --sign "$GITHUB_WORKSPACE/key-apk.sec" \
                    --output packages.adb *.apk

                  apk adbdump --format json packages.adb | python3 "$MAKE_INDEX_PY" -f apk -a "$sub_dir" - > index.json
                )
              else
                echo "⏭️ Skipping $sub_dir: No APK files found."
              fi
            done

            # === 第二阶段：影子目录处理 ===
            SNAP_PUB="$GITHUB_WORKSPACE/public/snapshot/packages"
            for arch_path in $(ls -d $SNAP_PUB/*/ 2>/dev/null); do
              arch=$(basename "$arch_path")
              [[ "$arch" == "luci" || "$arch" == "common" ]] && continue

              for group in "luci" "common"; do
                phys_dir_abs="$SNAP_PUB/$group"
                [ ! -d "$phys_dir_abs" ] && continue
                shadow_dir="$SNAP_PUB/$arch/$group"
                mkdir -p "$shadow_dir"

                (
                  cd "$phys_dir_abs"
                  valid_files=$(ls *.apk packages.adb* 2>/dev/null || true)

                  if [ -n "$valid_files" ]; then
                    echo "🔗 Linking $group -> $arch (snapshot)"
                    for f in $valid_files; do
                      ln -snf "../../$group/$f" "$shadow_dir/$f"
                    done

                    cd "$shadow_dir"
                    apk adbdump --format json packages.adb | python3 "$MAKE_INDEX_PY" -f apk -a "$arch" - > index.json
                  fi
                )
              done
            done

            # === 第三阶段：收尾 (snapshot 专属，不生成版本别名) ===
            cp "$GITHUB_WORKSPACE/public-key-25.12.pem" "$GITHUB_WORKSPACE/public/snapshot/packages/key.pem"
            echo "✅ Snapshot feed processed successfully."
          else
            echo "⏭️ Skipping snapshot channel: $SNAP_ROOT not found."
          fi

          # =========================================================
          # 附加阶段：把 release 端 luci 组的全部软件包链接进 snapshot 的 luci 组。
          # 否则 snapshot 的 luci 目录里只会有当前正处于 snapshot 通道的那一个包
          # （比如只有 luci-app-adguardhome），其余所有 luci 包都会缺失。
          #
          # 去重按“包名”而不是“完整文件名”判断：文件名形如
          # <pkgname>-<version>.apk，version 一律以数字开头且不含连字符
          # （apk 打包本身就要求版本号不能带 '-'），所以用“去掉末尾那段
          # -<数字开头...>”的方式就能拿到纯包名。这样即便某个包因为
          # release/snapshot 通道切换，在两边各留了一个不同版本号的文件
          # （例如 luci-app-adguardhome-26.263.49837~2105706.apk 和
          # luci-app-adguardhome-26.263.82712~07632bb.apk），也只会保留
          # snapshot 原生构建的那一份，release 端的旧版本不会被链接进来。
          #
          # 用软链接而不是复制；合并完之后必须重新签名/重建索引，否则
          # 链接进来的包不会出现在 snapshot 的 index.json 里。
          # =========================================================
          pkg_name_of() {
            basename "$1" .apk | sed -E 's/-[0-9][^-]*$//'
          }

          RELEASE_LUCI="$GITHUB_WORKSPACE/public/releases/packages-$ver/luci"
          SNAP_LUCI="$GITHUB_WORKSPACE/public/snapshot/packages/luci"

          if [ -d "$RELEASE_LUCI" ]; then
            mkdir -p "$SNAP_LUCI"
            echo "🔗 Merging release luci packages into the snapshot luci feed..."

            # 先记录 snapshot 目录里已经有哪些包名是"原生"构建的（合并前的状态）
            declare -A NATIVE_PKG_NAMES=()
            for nf in "$SNAP_LUCI"/*.apk; do
              [ -e "$nf" ] || continue
              NATIVE_PKG_NAMES["$(pkg_name_of "$nf")"]=1
            done

            (
              cd "$RELEASE_LUCI"
              for f in *.apk; do
                [ -e "$f" ] || continue
                pkgname=$(pkg_name_of "$f")

                if [ -n "${NATIVE_PKG_NAMES[$pkgname]:-}" ]; then
                  echo "   ↳ Skipping $f: snapshot already has a native build of $pkgname"
                  continue
                fi

                if [ ! -e "$SNAP_LUCI/$f" ]; then
                  ln -snf "../../../releases/packages-$ver/luci/$f" "$SNAP_LUCI/$f"
                fi
              done
            )

            (
              cd "$SNAP_LUCI"
              if ls *.apk >/dev/null 2>&1; then
                echo "✍️ Re-signing merged snapshot luci feed"
                apk mkndx --allow-untrusted \
                  --sign "$GITHUB_WORKSPACE/key-apk.sec" \
                  --output packages.adb *.apk
                apk adbdump --format json packages.adb | python3 "$MAKE_INDEX_PY" -f apk -a "luci" - > index.json
              fi
            )
            echo "✅ Snapshot luci feed merged with release luci feed."
          fi

          mkdir -p $GITHUB_WORKSPACE/.stfolder

      - name: Sync feeds to self-hosted server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          RSYNC_OPTS: "-avz --delete --no-perms --no-owner --no-group --omit-dir-times"
          RSYNC_PORT: ${{ secrets.RSYNC_PORT }}
        run: |
          echo "$DEPLOY_KEY" | base64 -d > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $RSYNC_PORT \
            ${DEPLOY_USER}@${DEPLOY_SERVER} "mkdir -vp ${DEPLOY_PATH}/.stfolder"
          rsync $RSYNC_OPTS --exclude '.stfolder' \
            -e "ssh -i deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $RSYNC_PORT" \
            public/ ${DEPLOY_USER}@${DEPLOY_SERVER}:${DEPLOY_PATH}/
            
      - name: Deploy feed to GitHub Pages
        run: |
          cd public
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update feed $(date +'%Y-%m-%d %H:%M:%S')"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
